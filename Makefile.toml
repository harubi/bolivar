# cargo-make tasks for Bolivar
# Install: cargo install cargo-make
# Run:     cargo make <task>

[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.build]
description = "Build all Rust crates"
command = "cargo"
args = ["build"]

[tasks.build-py]
description = "Build Python extension (maturin develop)"
command = "uv"
args = ["run", "maturin", "develop"]

[tasks.test]
description = "Run Rust tests (nextest)"
command = "cargo"
args = ["nextest", "run", "--workspace", "--locked"]

[tasks.test-py]
description = "Run Python tests"
command = "uv"
args = ["run", "--group", "test", "pytest", "tests/", "-v"]
dependencies = ["build-py"]

[tasks.test-release]
description = "Validate Semantic Release state"
command = "npm"
args = ["run", "test:release"]

[tasks.test-parity]
description = "Run upstream pdfminer.six and pdfplumber parity suites"
script = '''
set -e
for suite in pdfminer.six pdfplumber; do
  if find "references/$suite" -type f -name "test*.py" -print -quit | grep -q .; then
    PYTHONPATH="crates/python/python:references/$suite" \
      uv run --with pytest --with pytest-cov --with pandas --with pypdfium2 \
      -m pytest "references/$suite/"
  else
    echo "Skipping $suite: references/$suite missing tests (run git submodule update --init)"
  fi
done
'''

[tasks.bench]
description = "Run Rust benchmarks"
command = "cargo"
args = ["bench", "-p", "bolivar-bench"]

[tasks.fmt]
description = "Format Rust and Python"
script = '''
set -e
cargo fmt
uv run --group typecheck ruff format crates/python/python
'''

[tasks.lint]
description = "Format check, clippy, Python type/lint/stub checks"
script = '''
set -e
cargo fmt --check
cargo clippy --all-targets -- -D warnings
uv run --group typecheck ty check crates/python/python --error all --error-on-warning
uv run --group typecheck ruff check crates/python/python
uv run --group typecheck ruff format --check crates/python/python
uv run --with pyright pyright --verifytypes bolivar --ignoreexternal
uv run --with pyright pyright --verifytypes pdfminer --ignoreexternal
uv run --with pyright pyright --verifytypes pdfplumber --ignoreexternal
uv run python scripts/check_stub_parity.py
'''

[tasks.gen-kotlin]
description = "Build UniFFI release lib and generate Kotlin bindings"
script = '''
set -euo pipefail
cargo build -p bolivar-uniffi --release
case "$(uname -s)" in
  Darwin) lib="target/release/libbolivar_uniffi.dylib" ;;
  Linux) lib="target/release/libbolivar_uniffi.so" ;;
  MINGW*|MSYS*|CYGWIN*) lib="target/release/bolivar_uniffi.dll" ;;
  *) echo "Unsupported platform: $(uname -s)" >&2; exit 1 ;;
esac
mkdir -p crates/uniffi/kotlin
find crates/uniffi/kotlin -mindepth 1 -maxdepth 1 -exec rm -rf {} +
cargo run --release -p bolivar-uniffi-bindgen -- \
  generate --library "$lib" --language kotlin --out-dir crates/uniffi/kotlin
'''

[tasks.ci]
description = "Lint plus all tests"
dependencies = ["lint", "test", "test-py", "test-release"]

[tasks.clean]
description = "Remove all build artifacts"
script = '''
cargo clean
rm -rf target/wheels .pytest_cache .coverage .criterion coverage.xml flamegraph.svg bench_err.log
find . -type d -name "__pycache__" -prune -exec rm -rf {} +
find . -type d -name "*.egg-info" -prune -exec rm -rf {} +
'''
