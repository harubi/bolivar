[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bolivar"
description = "Fast PDF content extraction, written in Rust with Python bindings"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ahmed Aloufi", email = "936636+harubi@users.noreply.github.com" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/harubi/bolivar"

[project.optional-dependencies]
pandas = [
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.251219",
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "crates/python/python"
module-name = "bolivar._bolivar"
profile = "release"
features = ["pyo3/extension-module"]
python-packages = ["bolivar", "pdfminer", "pdfplumber", "sitecustomize"]
include = [
    "crates/python/python/bolivar/_bolivar.pyi",
    "crates/python/python/bolivar/py.typed",
    "crates/python/python/pdfminer/py.typed",
    "crates/python/python/bolivar_autoload.py",
    "crates/python/python/bolivar_autoload.pth",
    "rust-toolchain.toml",
    "LICENSE",
    "crates/icu/LICENSE-ICU",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/icu/src/**/*" },
    { file = "crates/icu/icu4c/**/*" },
]

[dependency-groups]
bench = [
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
]
test = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
typecheck = [
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pandas-stubs>=3.1.0.261029",
    "pypdfium2>=5.15.2",
    "ruff>=0.17.5",
    "ty>=0.0.103",
]

[tool.ty]

[tool.ty.src]
exclude = [".venv/**", "target/**", "references/**"]

[tool.ty.environment]
root = [".", "crates/python/python"]
python-version = "3.11"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
target-version = "py311"
src = ["crates/python/python"]

[tool.ruff.lint]
# `select`, not `extend-select`: ruff 0.16 grew its defaults to 413 rules.
select = [
    "ANN",
    "TC",
    "E",
    "W",
    "F",
    "I",
    "PGH003",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["ANN"]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
allow-star-arg-any = false
