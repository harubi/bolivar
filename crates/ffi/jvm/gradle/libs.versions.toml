[versions]
archunit = "1.5.1"
clojure = "1.12.6"
errorprone = "2.52.0"
googleJavaFormat = "2.0.0"
jmh = "1.37"
jspecify = "1.0.1"
junit = "6.1.3"
nullaway = "0.14.3"
testCheck = "1.1.3"

[libraries]
archunit-junit = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
clojure = { module = "org.clojure:clojure", version.ref = "clojure" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
test-check = { module = "org.clojure:test.check", version.ref = "testCheck" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
jmh = { id = "me.champeau.jmh", version = "0.7.4" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
nullaway = { id = "net.ltgt.nullaway", version = "3.3.0" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
