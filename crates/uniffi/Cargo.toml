[package]
name = "bolivar-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for bolivar PDF library"
publish = false

[lib]
name = "bolivar_uniffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
bolivar-core.workspace = true
thiserror.workspace = true
tokio = { version = "1.40", features = ["rt-multi-thread"] }
# No `cli` feature: it pulls clap and the template engine into the cdylib.
# The generator lives in crates/uniffi-bindgen.
uniffi = { version = "0.31.0" }

[build-dependencies]
uniffi = { version = "0.31.0", features = ["build"] }

[dev-dependencies]
pollster = "0.4"
