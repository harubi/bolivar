name: CI

on:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - '*'
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Zthreads=8"

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Rust
        run: rustup show active-toolchain
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install release tools
        run: npm ci
      - name: Validate release
        run: npm run test:release

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout test submodules
        run: git submodule update --init --depth 1 references/pdfplumber references/tabula-java references/pdfminer.six
      - name: Setup Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        run: cargo nextest run --workspace --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # v6's default "enhanced" cache is proprietary; using it accepts
          # its Terms of Use. "basic" is the MIT-licensed cache.
          cache-provider: basic
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build native library
        run: cargo build -p bolivar-uniffi --release --locked
      - name: Install native test library
        run: |
          mkdir -p crates/uniffi/jvm/natives/linux-x86-64
          cp target/release/libbolivar_uniffi.so crates/uniffi/jvm/natives/linux-x86-64/
      - name: Gradle check
        run: ./gradlew check
        working-directory: crates/uniffi/jvm

  cross-platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds inside the manylinux container, where the host's
          # setup-python path does not exist. The others build on the host.
          - os: ubuntu-24.04
            target: x86_64
            interpreter: /opt/python/cp311-cp311/bin/python
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        id: setup-python
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          # --features replaces the pyproject list, so extension-module must
          # be repeated here.
          args: --release --out dist -i ${{ matrix.interpreter || steps.setup-python.outputs.python-path }} --features pyo3/extension-module,pyo3/abi3-py311
          manylinux: 2_28
      - name: Verify ICU is static
        if: runner.os != 'Windows'
        run: sh scripts/verify-wheel-static-icu.sh dist
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install bolivar --no-index --find-links dist --force-reinstall
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from pdfminer.pdfdocument import PDFDocument
          from pdfminer.pdfpage import PDFPage
          from pdfminer.pdfparser import PDFParser

          fixture = Path("crates/core/tests/fixtures/simple1.pdf")
          document = PDFDocument(PDFParser(BytesIO(fixture.read_bytes())))
          pages = list(PDFPage.create_pages(document))
          assert pages, "expected at least one parsed page"
          print("cross-platform smoke check passed")
          PY
